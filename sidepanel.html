<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSeek</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main id="app">
    <!-- Loading splash: shown until the embedded app reports load. -->
    <div id="splash" class="splash" role="status" aria-live="polite">
      <div class="splash__mark">
        <img src="icons/icon128.png" alt="" width="56" height="56" />
        <span class="splash__ring" aria-hidden="true"></span>
      </div>
      <p class="splash__text">正在连接 DeepSeek…</p>
      <div class="splash__bar" aria-hidden="true"><i></i></div>
    </div>

    <!-- The official web app. -->
    <iframe
      id="ds-frame"
      class="frame"
      title="DeepSeek"
      src="about:blank"
      frameborder="0"
      allow="clipboard-read; clipboard-write; microphone; fullscreen"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <!-- Shown when the frame fails to paint in time (e.g. ruleset disabled). -->
    <section id="fallback" class="fallback" hidden>
      <img class="fallback__logo" src="icons/icon128.png" alt="" width="44" height="44" />
      <h1 class="fallback__title">无法加载 DeepSeek</h1>
      <p class="fallback__desc">
        侧边栏没能加载 DeepSeek 网页版。常见原因：拦截规则被关闭，或网络暂时不可用。
      </p>
      <div class="fallback__actions">
        <button class="btn btn--primary" type="button" data-act="retry">重试</button>
        <button class="btn" type="button" data-act="tab">在新标签页打开</button>
        <button class="btn" type="button" data-act="window">在独立窗口打开</button>
      </div>
      <button class="fallback__link" type="button" data-act="options">打开设置并检查拦截规则 →</button>
    </section>

    <!-- Floating shuttle, hover to expand. -->
    <nav id="toolbar" class="toolbar" aria-label="DeepSeek 侧边栏工具">
      <button class="toolbar__btn" type="button" data-act="reload" title="重新加载" aria-label="重新加载">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
      </button>
      <button class="toolbar__btn" type="button" data-act="tab" title="在新标签页打开" aria-label="在新标签页打开">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7Z"/><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7Z"/></svg>
      </button>
      <button class="toolbar__btn" type="button" data-act="window" title="在独立窗口打开" aria-label="在独立窗口打开">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3V5Zm2 2v2h14V7H5Zm0 4v6h14v-6H5Z"/></svg>
      </button>
      <button class="toolbar__btn" type="button" data-act="options" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.23.41.47.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
      </button>
    </nav>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
